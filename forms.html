<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>forms</title>
  </head>
<body>
    <h1>Personal Information Form</h1>
<form>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>
    <label for="Contact">Contact Number:(This will be hidden)</label>
    <input type="password" id="contact" name="contact"><br><br>
    <label for="gender">Gender:</label>
    <input type="radio" id="male" name="gender" value="male">Male<br>
    <input type="radio" id="female" name="gender" value="female">female<br><br>
    <label for="favourate city">Favourate city:</label><br>
    <input type="checkbox" id="city1" name="city1" value="newyork">
    new york<br>
    <input type="checkbox" id="city2" name="city2" value="newdelhi">
    new delhi<br>
    <input type="checkbox" id="city3" name="city3" value="Kathmandu">
    kathmandu<br><br>
    <input type="submit">   
</form>
</body>
</html>
