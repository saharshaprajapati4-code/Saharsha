<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Jungle Explorer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{position:relative;}
section{padding:80px 20px;height:100vh;}
.carousel-item{height:250px;background:green;color:white;text-align:center;padding-top:80px;}
</style>
</head>

<body data-bs-spy="scroll" data-bs-target="#nav">

<nav id="nav" class="navbar navbar-dark bg-success sticky-top">
<div class="container">
<a class="navbar-brand" href="#">Jungle Explorer</a>
<div>
<a class="nav-link d-inline text-white" href="#home">Home</a>
<a class="nav-link d-inline text-white" href="#about">About</a>
<a class="nav-link d-inline text-white" href="#contact">Contact</a>
</div>
</div>
</nav>

<section id="home">
<h2>My Jungle Explorer</h2>

<div id="carousel" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner">
<div class="carousel-item active"><h3>Forest</h3></div>
<div class="carousel-item"><h3>Animals</h3></div>
<div class="carousel-item"><h3>Nature</h3></div>
</div>

<button class="carousel-control-prev" data-bs-target="#carousel" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>

<button class="carousel-control-next" data-bs-target="#carousel" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>

</div>
</section>

<section id="about" class="bg-light">
<h2>About</h2>
<p>Explore jungles and wildlife.</p>
</section>

<section id="contact">
<h2>Contact</h2>
<p>jungle@example.com</p>
</section>
