<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4fff4; font-family: Arial, sans-serif; 
            .jumbotron {
                background-color: #e6f9ec; 
                border-left: 6px solid #FF5A43;
            }
            .jumbotron h1 {
                color: #FF5A43; 
            }
            .section-title {
                color: #FF5A43; 
                font-weight: bold; 
                margin-top: 30px;
                margin-bottom: 20px;
            }
            p{
                font-weight: bold;
                margin-bottom: 5px;
            } 
        }
    </style>
</head>
<body>

    <div class="jumbotron jumbotron-fluid">
        <div class="container">
            <h1>My Science Lab</h1>
            <p class="lead">Welcome to our science lab! Here are the experiments running, the discoveries made,
                and how far each research progress have come.</p>
                <button class="btn btn-primary"> Chemistry</button>
                <button class="btn btn-success"> Biology</button>
        </div>
    </div>
    
    <div class="container">
        <h2 class="experiment-title">Experiments completed <span class="badge badge-danger">4</span></h2>
        <p> Chemistry <span class="badge badge-primary">7 experiments</span></p>
        <p> Biology <span class="badge badge-success">5 experiments</span></p>
    </div>

    <<div class="container">
        <h2 class="section-title">Research progress</h2>
        <p>Chemistry</p>
        <div class="progress-bar bg-primary" style="width:85%">85%</div>
        <p>Biology</p>
        <div class="progress-bar bg-success" style="width:70%">70%</div>
    </div>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

</body>
</html>
