<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="weather-container">

        <div class="weather-card">
            <div class="weather-icon">☀️</div>
            <h1>30°C</h1>
            <h2>Sunny</h2>
            <p>Kathmandu, Nepal</p>
        </div>

        <div class="forecast">
            <h3>Weekly Forecast</h3>

            <div class="forecast-days">
                <div class="day">
                    <p>Mon</p>
                    <span>☀️</span>
                    <p>29°C</p>
                </div>

                <div class="day">
                    <p>Tue</p>
                    <span>⛅</span>
                    <p>26°C</p>
                </div>

                <div class="day">
                    <p>Wed</p>
                    <span>🌧️</span>
                    <p>22°C</p>
                </div>

                <div class="day">
                    <p>Thu</p>
                    <span>☁️</span>
                    <p>24°C</p>
                </div>

                <div class="day">
                    <p>Fri</p>
                    <span>☀️</span>
                    <p>30°C</p>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
