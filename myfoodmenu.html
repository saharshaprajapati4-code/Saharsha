<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    <body {
        font-family: Arial;
        background-color: #fff8f0;
        padding: 30px;
        text-align: center;
    }

      h1 {
         color: #e65c00;
      }
      /* Sibling selector - style the paragraph right after h1 */
      h1 + p {
         background-color: #ffe0b2;
         padding: 10px 20px;
         border-radius: 8px;
         color:#bf360c;
         display: inline-block;
      }
      ul{ padding: 0; margin top: 20px; 
      
      /*child selector - selects only diract li children of ul */
      ul > li {
         list-style: none;
         font-size:18px;
         font-weight: bold;
         color: #5d4037;
         padding: 10px 20px;
         margin: 6px auto;
         width: 260px;
         background: #fff3e0;
         border-radius: 8px;
      }

      /* nth-child - highlights the third child as chef's special */
      ul > li:nth-child(3) {
         background: #ffe082;
         color: #e65c00;
      }

      .desc {
         color: #555;
         margin-top : 20px;
         font-size: 15px;
         max-width: 400px;
         margin-left: auto;
         margin-right: auto;
      }
      /* first-letter - makes the first letter big and bold */

.desc::first-letter {

font-size: 220%;

color: #e65c00;

font-weight: bold;

}

.links { margin-top: 25px; }

/* Hover Effect - links glow when mouse moves over them */

a {

color: #e65c00;

text-decoration: none;

font-size: 15px;

margin: 0 12px;

padding: 8px 18px;

border: 2px solid #e65c00;

border-radius: 8px;

}

    a:hover{
        background: #e65c00; 
        color: white;
    }
   </style>
</head>
<body>
  <h1>My Food Menu</h1>

   <li>Ice Cream </li>
  </ui>

  <p class=""desc"> Every dish on this menu is made with love and loads of flavour.
      Try them all and find your favourate!
  </p>

<dic class="links">
   <a href="#">Order Now</a><br>
   <a href="#">See more</a>
</dic>
</body>
</html>
