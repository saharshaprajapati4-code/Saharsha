<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Media Adventure</title>
</head>
<body>

  <header>
    <h1>My Media Adventure</h1>
  </header>

  <main>

    <!-- Image -->
    <section>
      <h2>Image</h2>
      <img src="nature.jpg" alt="Nature" width="300">
    </section>

    <!-- Audio -->
    <section>
      <h2>Audio</h2>
      <audio controls>
        <source src="music.mp3" type="audio/mpeg">
      </audio>
    </section>

    <!-- Video -->
    <section>
      <h2>Video</h2>
      <video width="320" controls>
        <source src="movie.mp4" type="video/mp4">
      </video>
    </section>

    <!-- Iframe -->
    <section>
      <h2>Website</h2>
      <iframe src="https://example.com" width="400" height="200"></iframe>
    </section>

  </main>

  <footer>
    <p>My Media Adventure</p>
  </footer>

</body>
</html>
