<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Progress Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <div class="bg-light p-5 rounded">
        <h1>My Study Progress Dashboard</h1>
    </div>

    <div class="mt-5">
        <h3>Subjects</h3>

        <button class="btn btn-primary m-1">Math</button>
        <button class="btn btn-success m-1">Science</button>
        <button class="btn btn-warning m-1">English</button>
        <button class="btn btn-danger m-1">History</button>
    </div>

    <div class="mt-5">
        <h3>Lessons</h3>

        <p>Math <span class="badge bg-primary">12 Lessons</span></p>
        <p>Science <span class="badge bg-success">8 Lessons</span></p>
        <p>English <span class="badge bg-warning text-dark">10 Lessons</span></p>
        <p>History <span class="badge bg-danger">6 Lessons</span></p>
    </div>

    <div class="mt-5 mb-5">
        <h3>Learning Progress</h3>

        <p>Math</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-primary" style="width:75%;">
                75%
            </div>
        </div>

        <p>Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-success" style="width:60%;">
                60%
            </div>
        </div>

        <p>English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning text-dark" style="width:85%;">
                85%
            </div>
        </div>

        <p>History</p>
        <div class="progress">
            <div class="progress-bar bg-danger" style="width:40%;">
                40%
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
